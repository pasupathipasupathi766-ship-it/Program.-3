
<!DOCTYPE html>
<html>
<head>
    <title>Basic Selectors</title>

    <style>
        /* Element Selector */
        h1 {
            color: blue;
        }

        /* ID Selector */
        #para {
            color: red;
        }

        /* Class Selector */
        .text {
            color: green;
        }

        /* Universal Selector */
        * {
            font-family: Arial;
        }
    </style>
</head>

<body>
    <h1>Basic CSS Selectors</h1>

    <p id="para">This is an ID selector.</p>

    <p class="text">This is a Class selector.</p>

    <h2>This is an Element selector example.</h2>

</body>
</html>
